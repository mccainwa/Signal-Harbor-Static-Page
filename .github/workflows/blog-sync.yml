# Import, validate, commit, and publish the newsletter without a review PR.
# Deploy in this run: a GITHUB_TOKEN push does not trigger deploy.yml.
name: Blog sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

# Share the Pages deployment lock with deploy.yml. Do not interrupt a publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync the public Beehiiv RSS feed
        run: npm run sync:blog

      - name: Detect content and new image changes
        id: diff
        run: |
          git add content/blog public/images/blog
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Build and verify before publishing
        run: npm run check

      - name: Commit validated newsletter content
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Blog sync: publish Signal Harbor Weekly content"
          # Reject concurrent main changes rather than overwriting them.
          git push origin HEAD:main

      # Deploy on no-change runs too, so an earlier deployment failure heals
      # on the next hourly run even if the imported content is already committed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Publish the validated website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publication summary
        run: |
          echo "Newsletter import, build, export verification, and Pages deployment passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Content changed: ${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
